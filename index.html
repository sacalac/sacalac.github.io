<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rhine Travel Companion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --water-blue: #2563eb;
  --panel-bg:   rgba(255, 255, 255, 0.85);
  --border:     rgba(0, 0, 0, 0.1);
  --accent:     #ef4444; 
  --text-main:  #0f172a; 
  --text-muted: #64748b;
  --green:      #10b981;
  --red:        #e74c3c;
  --mono:       'Share Tech Mono', monospace;
  --sans:       -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #f8fafc;
  font-family: var(--sans);
  color: var(--text-main);
}

/* Oversized Map Wrapper to allow CSS rotation without clipping corners */
#map-wrapper {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

#map {
  position: absolute;
  width: 150vmax;
  height: 150vmax;
  left: calc(50% - 75vmax);
  top: calc(50% - 75vmax);
  /* Removed dark filters for a bright, tourist-friendly aesthetic */
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
}

/* ── HUD TOP BAR (Clean & Frosted) ── */
#hud-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.80) 100%);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  padding: 0 16px;
  display: flex;
  align-items: stretch;
  height: 80px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
}

.gauge {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 8px 10px;
  position: relative;
  flex: 1;
  border-right: 1px solid var(--border);
}
.gauge:last-child { border-right: none; }

.gauge-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.gauge-value {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1;
}
.gauge-value.dim { color: var(--text-muted); }
.gauge-value.highlight { color: var(--water-blue); font-family: var(--sans); font-weight: 700; font-size: 18px; }
.gauge-unit {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ── HUD BOTTOM (Uber-Style Floating Trip Card) ── */
#hud-bottom {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-width: 500px;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(20px);
  padding: 12px 16px;
  display: flex;
  align-items: stretch;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
}

#dest-callout {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px 16px;
  border-left: 1px solid var(--border);
  flex: 2;
  overflow: hidden;
}
#dest-callout .label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px;}
#dest-callout .dest-name { font-size: 20px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dest-callout .dest-name.empty { color: var(--text-muted); font-weight: 500; font-style: italic; }

#etaVal { color: var(--green); font-size: 24px; font-weight: 700; font-family: var(--sans); }

/* ── CONTROLS PANEL (Waze-Style Right-Aligned Column) ── */
.control-btn {
  position: absolute;
  right: 16px;
  width: 48px; height: 48px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  color: var(--text-main);
  box-shadow: 0 6px 16px rgba(0,0,0,0.1);
  z-index: 1100;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
}
.control-btn:hover { background: #ffffff; transform
