<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>River Real-Time Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; }
  #controls {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: white; padding: 8px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="controls">
  <button id="toggleBtn">North Up</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([50.1109, 8.6821], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution: '&copy; OpenStreetMap', maxZoom: 19
}).addTo(map);

L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{
  attribution: 'OpenSeaMap', maxZoom: 18
}).addTo(map);

const boatIcon = L.icon({
  iconUrl: 'https://cdn-icons-png.flaticon.com/512/1532/1532623.png',
  iconSize: [32,32],
  iconAnchor: [16,16]
});

let boatMarker = L.marker([50.1109, 8.6821], {icon: boatIcon}).addTo(map);

let heading = 0; // boat heading in degrees
let northUp = true; // map orientation flag

// Toggle button
const toggleBtn = document.getElementById('toggleBtn');
toggleBtn.addEventListener('click', () => {
  northUp = !northUp;
  toggleBtn.textContent = northUp ? 'North Up' : 'Boat Up';
  if(northUp){
    map.getContainer().style.transform = '';
  }
});

// Real-time GPS with optional heading
if('geolocation' in navigator){
  navigator.geolocation.watchPosition(pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    heading = pos.coords.heading ?? heading; // fallback if heading is null

    boatMarker.setLatLng([lat, lon]);
    boatMarker.setRotationAngle(heading); // rotation plugin needed for full marker rotation

    if(!northUp){
      // rotate map container to align boat heading up
      map.getContainer().style.transform = `rotate(${-heading}deg)`;
    } else {
      map.getContainer().style.transform = '';
    }

    map.setView([lat, lon], map.getZoom());

  }, err=>console.error(err), {enableHighAccuracy:true});
}else{
  alert('Geolocation not supported.');
}

</script>
</body>
</html>
