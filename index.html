<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rhine Navigation</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}
 .info {
    font-family: Arial, sans-serif;
    font-size: 14px;
 }
</style>
      <style>
html, body, #map {
    height: 100%;
    margin: 0;
}

#routePanel {

    position: absolute;

    top: 10px;
    left: 10px;

    z-index: 1000;

    width: 180px;

    background: white;

    padding: 8px;

    border-radius: 6px;

    font-family: Arial;

    font-size: 12px;

    box-shadow: 0 0 5px rgba(0,0,0,.3);
}

#destinationSearch {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
}
      </style>
</head>
<body>
<div id="routePanel">

    <input
        id="destinationSearch"
        list="destinationList"
        placeholder="Destination">

    <datalist id="destinationList"></datalist>

    <div id="routeInfo">
        No destination selected
    </div>

</div>

<div id="map"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
