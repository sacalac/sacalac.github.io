<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rhine Navigation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:     #0a0f1a;
  --panel:    #0e1622;
  --panel2:   #121d2e;
  --border:   #1e3050;
  --amber:    #f5a623;
  --amber-dim:#a86d12;
  --cyan:     #4dd9e8;
  --white:    #e8eef5;
  --muted:    #4a6080;
  --green:    #2ecc71;
  --red:      #e74c3c;
  --mono:     'Share Tech Mono', monospace;
  --cond:     'Barlow Condensed', sans-serif;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--navy);
  font-family: var(--cond);
  color: var(--white);
}

/* ── MAP ── */
#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  filter: brightness(0.85) saturate(0.9);
}

/* Subtle scanline over map */
#map::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.03) 0px,
    rgba(0,0,0,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 400;
}

/* ── HUD BARS (SHARED STYLES) ── */
.hud-bar {
  position: absolute;
  left: 0; right: 0;
  z-index: 1000;
  background: linear-gradient(180deg, rgba(10,15,26,0.97) 0%, rgba(10,15,26,0.85) 100%);
  border-color: var(--border);
  border-style: solid;
  backdrop-filter: blur(12px);
  padding: 0 16px;
  display: flex;
  align-items: stretch;
  gap: 2px;
  height: 72px;
}

#hud-top {
  top: 0;
  border-width: 0 0 1px 0;
}

#hud-bottom {
  bottom: 0;
  border-width: 1px 0 0 0;
}

/* gauge cells */
.gauge {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 8px 14px;
  position: relative;
  min-width: 72px;
  flex: 1;
  border-right: 1px solid var(--border);
}
.gauge:last-child { border-right: none; }

.gauge-label {
  font-family: var(--cond);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}
.gauge-value {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 400;
  color: var(--amber);
  line-height: 1;
  letter-spacing: 0.04em;
}
.gauge-value.dim { color: var(--muted); }
.gauge-value.highlight { color: var(--cyan); }
.gauge-unit {
  font-family: var(--cond);
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.1em;
}

/* active destination callout */
#dest-callout {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px 16px;
  border-left: 1px solid var(--border);
  min-width: 140px;
  max-width: 200px;
}
#dest-callout .label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.15em;
  color: var(--muted);
  text-transform: uppercase;
}
#dest-callout .dest-name {
  font-family: var(--cond);
  font-size: 16px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#dest-callout .dest-name.empty {
  color: var(--muted);
  font-weight: 400;
  font-style: italic;
}

/* ── SEARCH BUTTON ── */
#searchBtn {
  position: absolute;
  left: 14px;
  top: calc(72px + 14px);
  width: 46px;
  height: 46px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: rgba(10,15,26,0.92);
  backdrop-filter: blur(8px);
  color: var(--cyan);
  font-size: 18px;
  z-index: 1200;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}
#searchBtn:hover {
  background: rgba(20,30,50,0.98);
  border-color: var(--cyan);
}

/* ── SEARCH PANEL ── */
#searchPanel {
  position: absolute;
  top: calc(72px + 14px);
  left: -340px;
  width: 300px;
  background: rgba(12,18,28,0.97);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  z-index: 1100;
  transition: left 0.22s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter: blur(16px);
}
#searchPanel.open { left: 68px; }

#searchPanel-header {
  font-family: var(--cond);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

#destinationSearch {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--white);
  font-family: var(--cond);
  font-size: 15px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.15s;
}
#destinationSearch::placeholder { color: var(--muted); }
#destinationSearch:focus { border-color: var(--cyan); }

#suggestions {
  margin-top: 8px;
  max-height: 260px;
  overflow-y: auto;
}
#suggestions::-webkit-scrollbar { width: 4px; }
#suggestions::-webkit-scrollbar-track { background: transparent; }
#suggestions::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.suggestion {
  padding: 9px 12px;
  border-bottom: 1px solid rgba(30,48,80,0.5);
  cursor: pointer;
  font-family: var(--cond);
  font-size: 14px;
  color: var(--white);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.1s;
}
.suggestion:last-child { border-bottom: none; }
.suggestion:hover { background: rgba(77,217,232,0.07); color: var(--cyan); }
.suggestion-type {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.06);
  color: var(--muted);
  flex-shrink: 0;
}
.suggestion-type.lock { color: var(--amber); background: rgba(245,166,35,0.1); }
.suggestion-type.port { color: var(--cyan); background: rgba(77,217,232,0.1); }

/* ── STATUS PILL (shifted up to clear bottom bar) ── */
#statusPill {
  position: absolute;
  bottom: 86px;
  right: 14px;
  z-index: 1000;
  background: rgba(10,15,26,0.9);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(8px);
}
#gpsIndicator {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  transition: background 0.3s;
}
#gpsIndicator.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
#gpsIndicator.error  { background: var(--red); }

/* Leaflet overrides */
.leaflet-control-attribution { display: none; }
.leaflet-control-zoom { margin-bottom: 80px !important; } /* Shift buttons up to clear bottom bar */
.leaflet-control-zoom a {
  background: rgba(10,15,26,0.92) !important;
  border-color: var(--border) !important;
  color: var(--cyan) !important;
}

/* Custom marker */
.vessel-marker {
  width: 14px; height: 14px;
  background: var(--cyan);
  border: 2px solid white;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(77,217,232,0.6);
}
</style>
</head>
<body>

<div id="hud-top" class="hud-bar">
  <div class="gauge">
    <span class="gauge-label">RKM</span>
    <span class="gauge-value dim" id="kmVal">---.-</span>
    <span class="gauge-unit">km</span>
  </div>

  <div class="gauge">
    <span class="gauge-label">SOG</span>
    <span class="gauge-value dim" id="sogVal">--.-</span>
    <span class="gauge-unit">km/h</span>
  </div>

  <div class="gauge">
    <span class="gauge-label">REM</span>
    <span class="gauge-value dim" id="remVal">---.-</span>
    <span class="gauge-unit">km</span>
  </div>

  <div class="gauge">
    <span class="gauge-label">LOCKS</span>
    <span class="gauge-value dim" id="locksVal">--</span>
    <span class="gauge-unit">ahead</span>
  </div>
</div>

<div id="hud-bottom" class="hud-bar">
  <div class="gauge">
    <span class="gauge-label">TTL</span>
    <span class="gauge-value dim" id="ttlVal">--</span>
    <span class="gauge-unit">min</span>
  </div>

  <div class="gauge">
    <span class="gauge-label">ETA</span>
    <span class="gauge-value highlight dim" id="etaVal">--h--</span>
    <span class="gauge-unit">&nbsp;</span>
  </div>

  <div id="dest-callout">
    <span class="label">Destination</span>
    <span class="dest-name empty" id="destName">Not set</span>
  </div>
</div>

<button id="searchBtn" title="Search destination">⌖</button>

<div id="searchPanel">
  <div id="searchPanel-header">Set Destination</div>
  <input id="destinationSearch" placeholder="Port or lock name…" autocomplete="off" spellcheck="false">
  <div id="suggestions"></div>
</div>

<div id="map"></div>

<div id="statusPill">
  <span id="gpsIndicator"></span>
  <span id="gpsStatus">AWAITING GPS</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

<script>
window.hudUpdate = function(data) {
  const set = (id, val, active) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = val;
    if (active !== undefined) {
      el.classList.toggle('dim', !active);
    }
  };
  if (data.km   !== undefined) set('kmVal',    data.km,    data.km    !== '---.-');
  if (data.sog  !== undefined) set('sogVal',   data.sog,   data.sog   !== '--.-');
  if (data.rem  !== undefined) set('remVal',   data.rem,   data.rem   !== '---.-');
  if (data.locks!== undefined) set('locksVal', data.locks, data.locks !== '--');
  if (data.ttl  !== undefined) set('ttlVal',   data.ttl,   data.ttl   !== '--');
  if (data.eta  !== undefined) set('etaVal',   data.eta,   data.eta   !== '--h--');
  if (data.dest !== undefined) {
    const el = document.getElementById('destName');
    if (el) {
      el.textContent = data.dest || 'Not set';
      el.classList.toggle('empty', !data.dest);
    }
  }
  if (data.gps !== undefined) {
    const dot = document.getElementById('gpsIndicator');
    const txt = document.getElementById('gpsStatus');
    if (dot) dot.className = 'active';
    if (txt) txt.textContent = 'GPS ACTIVE';
  }
  if (data.gpsError) {
    const dot = document.getElementById('gpsIndicator');
    const txt = document.getElementById('gpsStatus');
    if (dot) dot.className = 'error';
    if (txt) txt.textContent = 'GPS ERROR';
  }
};
</script>

</body>
</html>
