}).addTo(map);

});

let routeLine = null;

  destSelect.appendChild(opt);
}

function haversineKm(aLat,aLon,bLat,bLon){
  const R = 6371;
  const toRad = x => x * Math.PI/180;
  const dLat = toRad(bLat - aLat);
  const dLon = toRad(bLon - aLon);
  const la1 = toRad(aLat), la2 = toRad(bLat);
  const sinDlat = Math.sin(dLat/2), sinDlon = Math.sin(dLon/2);
  const aa = sinDlat*sinDlat + Math.cos(la1)*Math.cos(la2)*sinDlon*sinDlon;
  const c = 2*Math.atan2(Math.sqrt(aa), Math.sqrt(1-aa));
  return R * c;
}

function findNearestTown(lat, lon){
  let nearest = null;
  let best = Infinity;
  for(const t of towns){
    if(t.lat == null || t.lon == null) continue;
    const d = haversineKm(lat, lon, t.lat, t.lon);
    if(d < best){ best = d; nearest = t; }
  }
  return nearest;
}

function showRoute(destName, currentPos){
  if(!destName) return alert('Choose a destination');
  const dest = towns.find(t=>t.name===destName);
  if(!dest) return alert('Destination not found');

  if(!currentPos) return alert('Waiting for GPS position...');

  const nearest = findNearestTown(currentPos.lat, currentPos.lon);
  const nearestText = nearest ? `${nearest.name} (km ${nearest.km})` : '—';
  document.getElementById('nearest').textContent = nearestText;

  const remaining = (dest.km != null && nearest && nearest.km != null) ? (dest.km - nearest.km) : null;
  const dir = remaining != null ? (remaining>=0 ? 'downstream' : 'upstream') : '';
  document.getElementById('remaining').textContent = remaining != null ? Math.abs(remaining).toFixed(1) + ' km ('+dir+')' : '—';

  if(routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if(dest.lat != null && dest.lon != null){
    routeLine = L.polyline([[currentPos.lat, currentPos.lon],[dest.lat, dest.lon]], {color:'red', dashArray:'8,8', weight:3}).addTo(map);
    map.fitBounds(routeLine.getBounds(), {padding:[60,60]});
  } else {
    alert('Destination coordinates not available.');
  }
}

let currentPosition = null;
if('geolocation' in navigator){
  navigator.geolocation.watchPosition(p=>{
    const lat = p.coords.latitude;
    const lon = p.coords.longitude;
    shipMarker.setLatLng([lat, lon]);
    currentPosition = {lat, lon};
    if(!window._centeredOnce){ map.setView([lat, lon], 15); window._centeredOnce = true; }
  }, err=>{
    console.error(err);
    alert('Geolocation error: ' + err.message);
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:10000});
} else {
  alert('Geolocation not supported.');
}

document.getElementById('goBtn').addEventListener('click', ()=> showRoute(destSelect.value, currentPosition));
