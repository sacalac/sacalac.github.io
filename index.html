<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rhine Navigation</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

#topBar {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    height: 10vh;

    background: rgba(60,60,60,0.75);

    backdrop-filter: blur(6px);

    color: white;

    z-index: 1000;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.barRow {

    display: flex;

    justify-content: space-around;

    align-items: center;

    font-size: 16px;

    font-weight: bold;

    margin: 2px 0;
}

#searchBtn {

    position: absolute;

    left: 12px;

    top: 12vh;

    width: 58px;

    height: 58px;

    border: none;

    border-radius: 50%;

    background: rgba(60,60,60,0.85);

    color: white;

    font-size: 28px;

    z-index: 1200;

    box-shadow: 0 0 10px rgba(0,0,0,0.4);
}

#searchPanel {

    position: absolute;

    top: 12vh;

    left: -320px;

    width: 280px;

    background: rgba(255,255,255,0.96);

    border-radius: 12px;

    padding: 12px;

    z-index: 1100;

    transition: left .25s ease;
}

#searchPanel.open {

    left: 80px;
}

#destinationSearch {

    width: 100%;

    box-sizing: border-box;

    font-size: 16px;

    padding: 10px;
}

#suggestions {

    margin-top: 8px;

    max-height: 300px;

    overflow-y: auto;
}

.suggestion {

    padding: 10px;

    border-bottom: 1px solid #ddd;

    cursor: pointer;
}

.suggestion:hover {

    background: #f0f0f0;
}

</style>
</head>

<body>

<div id="topBar">

    <div class="barRow">
        <span id="locksInfo">Locks:-</span>
        <span id="sogInfo">SOG:-</span>
        <span id="kmInfo">RKM:-</span>
    </div>

    <div class="barRow">
        <span id="ttlInfo">TTL:-</span>
        <span id="etaInfo">ETA:-</span>
        <span id="remInfo">REM:-</span>
    </div>

</div>

<button id="searchBtn">🔍</button>

<div id="searchPanel">

    <input
        id="destinationSearch"
        placeholder="Search destination...">

    <div id="suggestions"></div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
