<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rhine Navigation</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
}

#map {
    width: 100%;
    height: 100%;
}

#topBar {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    height: 20vh;

    background: rgba(60,60,60,0.75);

    backdrop-filter: blur(6px);

    color: white;

    z-index: 1000;

    display: flex;

    flex-direction: column;

    justify-content: center;

    font-family: Arial, sans-serif;

    font-weight: bold;
}

.row {

    display: flex;

    justify-content: space-around;

    margin: 6px 0;

    font-size: 18px;
}

#searchBtn {

    position: absolute;

    left: 10px;

    top: 22vh;

    width: 52px;

    height: 52px;

    border: none;

    border-radius: 10px;

    background: rgba(60,60,60,0.85);

    color: white;

    font-size: 28px;

    z-index: 1200;
}

#searchPanel {

    position: absolute;

    top: 22vh;

    left: -270px;

    width: 250px;

    background: rgba(255,255,255,0.95);

    z-index: 1100;

    padding: 10px;

    border-radius: 10px;

    transition: left .3s;
}

#searchPanel.open {

    left: 70px;
}

#destinationSearch {

    width: 100%;

    box-sizing: border-box;

    font-size: 16px;

    padding: 8px;
}

</style>

</head>

<body>

<div id="topBar">

    <div class="row">
        <span id="locksInfo">Locks:-</span>
        <span id="sogInfo">SOG:-</span>
        <span id="kmInfo">RKM:-</span>
    </div>

    <div class="row">
        <span id="ttlInfo">TTL:-</span>
        <span id="etaInfo">ETA:-</span>
        <span id="remInfo">REM:-</span>
    </div>

</div>

<button id="searchBtn">⚓</button>

<div id="searchPanel">

    <input
        id="destinationSearch"
        list="destinationList"
        placeholder="Destination">

    <datalist id="destinationList"></datalist>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
