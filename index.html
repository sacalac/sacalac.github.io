<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhine Navigation</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root {
    --glass: rgba(255,255,255,0.75);
    --glass-border: rgba(255,255,255,0.45);
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --shadow: 0 10px 35px rgba(0,0,0,0.12);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    background: #f5f5f7;
}

#map {
    width: 100%;
    height: 100vh;
}

/* Main floating panel */
#routePanel {
    position: absolute;
    top: 20px;
    left: 20px;

    width: 340px;

    z-index: 1000;

    padding: 20px;

    border-radius: 28px;

    background: var(--glass);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    border: 1px solid var(--glass-border);

    box-shadow: var(--shadow);
}

#logo {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
}

#subtitle {
    color: var(--secondary);
    font-size: 13px;
    margin-bottom: 18px;
}

#destinationSearch {
    width: 100%;

    border: none;
    outline: none;

    padding: 14px 16px;

    border-radius: 16px;

    font-size: 15px;

    background: rgba(255,255,255,0.92);

    margin-bottom: 18px;
}

#destinationSearch:focus {
    box-shadow: 0 0 0 4px rgba(0,122,255,0.15);
}

/* Route card */
.card {
    background: rgba(255,255,255,0.55);

    border-radius: 18px;

    padding: 14px;

    margin-bottom: 12px;
}

.card-title {
    font-size: 12px;
    color: var(--secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
}

.row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.label {
    color: var(--secondary);
}

.value {
    font-weight: 600;
    color: var(--text);
}

.big-number {
    font-size: 30px;
    font-weight: 700;
    color: var(--text);
}

/* Floating status badge */
#statusBadge {
    position: absolute;
    bottom: 20px;
    left: 20px;

    z-index: 1000;

    padding: 14px 18px;

    border-radius: 20px;

    background: var(--glass);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    border: 1px solid var(--glass-border);

    box-shadow: var(--shadow);

    font-size: 14px;
    font-weight: 600;
}

/* Top-right vessel card */
#vesselCard {
    position: absolute;
    top: 20px;
    right: 20px;

    width: 220px;

    z-index: 1000;

    padding: 18px;

    border-radius: 24px;

    background: var(--glass);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    border: 1px solid var(--glass-border);

    box-shadow: var(--shadow);
}

.vessel-name {
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 12px;
}

.vessel-data {
    margin-bottom: 8px;
    color: var(--secondary);
}

/* Mobile */
@media (max-width: 768px) {

    #routePanel {
        left: 12px;
        right: 12px;
        width: auto;
        top: 12px;
    }

    #vesselCard {
        display: none;
    }

    #statusBadge {
        left: 12px;
        bottom: 12px;
    }
}
</style>
</head>

<body>

<div id="routePanel">

    <div id="logo">Rhine Navigation</div>

    <div id="subtitle">
        Inland Waterway Route Planner
    </div>

    <input
        id="destinationSearch"
        list="destinationList"
        placeholder="Search destination..."
    >

    <datalist id="destinationList"></datalist>

    <div class="card">
        <div class="card-title">Current Route</div>

        <div class="row">
            <span class="label">Destination</span>
            <span class="value" id="destinationName">—</span>
        </div>

        <div class="row">
            <span class="label">Distance</span>
            <span class="value" id="distanceValue">—</span>
        </div>

        <div class="row">
            <span class="label">ETA</span>
            <span class="value" id="etaValue">—</span>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Rhine Kilometer</div>
        <div class="big-number" id="rhineKm">—</div>
    </div>

    <div id="routeInfo">
        Select a destination to calculate a route.
    </div>

</div>

<div id="vesselCard">

    <div class="vessel-name">
        Vessel Status
    </div>

    <div class="vessel-data">
        Position: Live GPS
    </div>

    <div class="vessel-data">
        Course: —
    </div>

    <div class="vessel-data">
        Speed: —
    </div>

</div>

<div id="statusBadge">
    🛳️ Inland Navigation System
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Your existing navigation logic -->
<script src="app.js"></script>

</body>
</html>
