<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rhine Navigation</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,
body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
}

#map{
width:100%;
height:100%;
}

#topBar{

position:absolute;

top:0;
left:0;

width:100%;

height:10vh;

background:rgba(70,70,70,.55);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

z-index:1000;

color:white;

display:flex;

flex-direction:column;

justify-content:center;

border-bottom-left-radius:12px;

border-bottom-right-radius:12px;
}

.barRow{

display:grid;

grid-template-columns:repeat(6,1fr);

text-align:center;
}

.big{

font-size:22px;

font-weight:bold;
}

.small{

font-size:10px;

opacity:.85;
}

#destinationBar{

position:absolute;

top:10vh;

left:50%;

transform:translateX(-50%);

margin-top:3px;

background:rgba(70,70,70,.55);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

color:white;

padding:6px 16px;

border-radius:10px;

z-index:1000;

display:none;

max-width:80%;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

font-size:14px;

font-weight:bold;
}

#searchBtn{

position:absolute;

left:12px;

top:11vh;

width:58px;

height:58px;

border:none;

border-radius:50%;

background:rgba(70,70,70,.70);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

color:white;

font-size:28px;

z-index:1200;

box-shadow:0 0 10px rgba(0,0,0,.35);
}

#searchPanel{

position:absolute;

top:11vh;

left:-320px;

width:280px;

background:rgba(255,255,255,.96);

border-radius:12px;

padding:12px;

z-index:1100;

transition:left .25s ease;
}

#searchPanel.open{

left:80px;
}

#destinationSearch{

width:100%;

box-sizing:border-box;

padding:10px;

font-size:16px;

border-radius:8px;

border:1px solid #ccc;
}

#suggestions{

margin-top:8px;

max-height:300px;

overflow-y:auto;
}

.suggestion{

padding:10px;

border-bottom:1px solid #ddd;

cursor:pointer;
}

.suggestion:hover{

background:#f0f0f0;
}

</style>
</head>

<body>

<div id="topBar">

<div class="barRow big">

<div id="locksInfo">-</div>
<div id="sogInfo">-</div>
<div id="kmInfo">-</div>
<div id="ttlInfo">-</div>
<div id="etaInfo">-</div>
<div id="remInfo">-</div>

</div>

<div class="barRow small">

<div>LOCKS</div>
<div>SOG</div>
<div>RKM</div>
<div>TTL</div>
<div>ETA</div>
<div>REM</div>

</div>

</div>

<div id="destinationBar">
No destination
</div>

<button id="searchBtn">🔍</button>

<div id="searchPanel">

<input
id="destinationSearch"
placeholder="Search destination...">

<div id="suggestions"></div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
