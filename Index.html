<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rhine Progress Tracker</title>
<style>
  body{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial; margin:12px; color:#111}
  .card{border-radius:12px;padding:12px;margin-bottom:12px;background:#f7f7f7}
  label{display:block;margin-bottom:6px;font-weight:600}
  input,select,button{font-size:16px;padding:8px;border-radius:8px;border:1px solid #ddd;width:100%;box-sizing:border-box}
  button{background:#0366d6;color:white;border:none}
  .row{display:flex;gap:8px}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .stat{background:white;padding:8px;border-radius:8px;flex:1;min-width:110px;box-shadow:0 1px 0 rgba(0,0,0,0.06)}
  .progress-container{height:360px;width:80px;background:#eee;border-radius:8px;position:relative;margin:18px auto}
  .progress-fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#2ecc71,#1f9b4b);border-radius:8px 8px 0 0}
  .lock-marker{position:absolute;left:-6px;width:92px;height:2px;background:#b5651d;}
  .label-center{text-align:center;margin-top:8px}
  .small{font-size:13px;color:#555}
  .map-link{display:block;text-align:center;margin-top:8px;color:#0366d6}
</style>
</head>
<body>
  <h2>Rhine Progress Tracker</h2>

  <div class="card">
    <label>Destination (town name)</label>
    <input id="destInput" placeholder="e.g. Cologne"/>
    <div style="height:8px"></div>
    <label>Sample time to compute speed (seconds)</label>
    <input id="sampleSec" value="15" />
    <div style="height:8px"></div>
    <button id="startBtn">Start tracking</button>
  </div>

  <div id="status" class="card small">Not started</div>

  <div id="output" style="display:none">
    <div class="card">
      <div class="label-center"><strong id="destName">Destination:</strong></div>
      <div class="stats">
        <div class="stat"><div class="small">Direction</div><div id="direction">—</div></div>
        <div class="stat"><div class="small">Distance (river km)</div><div id="dist">—</div></div>
        <div class="stat"><div class="small">ETA</div><div id="eta">—</div></div>
        <div class="stat"><div class="small">Time left</div><div id="timeleft">—</div></div>
        <div class="stat"><div class="small">Speed (km/h)</div><div id="speed">—</div></div>
        <div class="stat"><div class="small">Locks left</div><div id="locks">—</div></div>
      </div>

      <div style="display:flex;justify-content:center;margin-top:8px">
        <div class="progress-container" id="bar">
          <div id="progressFill" class="progress-fill" style="height:0%"></div>
          <!-- lock markers inserted here -->
        </div>
      </div>
      <div class="label-center small">Progress along river (locks shown)</div>

      <a id="mapsBtn" class="map-link" target="_blank">Open route in Apple Maps</a>
    </div>
  </div>

<script>
(async function(){
  const RHINE_JSON_URL = "./rhine.json"; // <--- rhine.json in same repo root

  // load dataset
  let rhine = [];
  try {
    const r = await fetch(RHINE_JSON_URL);
    rhine = await r.json();
    rhine.sort((a,b)=>a.km - b.km);
  } catch(e){
    document.getElementById('status').innerText = "Failed to load Rhine dataset. Make sure rhine.json exists in repo root.";
    console.error(e);
    return;
  }

  function haversineKm(lat1,lon1,lat2,lon2){
    const R=6371;
    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return R*c;
  }

  function nearestPoint(lat,lon){
    let best = rhine[0], bd=Infinity;
    for(const p of rhine){
      const d=haversineKm(lat,lon,p.lat,p.lon);
      if(d<bd){bd=d;best=p;}
    }
    return best;
  }

  function riverDistanceKm(kmFrom, kmTo){
    return Math.abs(kmTo - kmFrom);
  }

  function countLocksBetween(kmFrom, kmTo){
    let start=kmFrom, end=kmTo;
    if(start> end) [start,end]=[end,start];
    let locks=0;
    for(let i=0;i<rhine.length;i++){
      if(rhine[i].km >= start && rhine[i].km < end){
        locks += (rhine[i].locks_to_next || 0);
      }
    }
    return locks;
  }

  // UI elements
  const startBtn=document.getElementById('startBtn');
  const statusEl=document.getElementById('status');
  const output=document.getElementById('output');
  const destNameEl=document.getElementById('destName');
  const directionEl=document.getElementById('direction');
  const distEl=document.getElementById('dist');
  const etaEl=document.getElementById('eta');
  const timeleftEl=document.getElementById('timeleft');
  const speedEl=document.getElementById('speed');
  const locksEl=document.getElementById('locks');
  const fillEl=document.getElementById('progressFill');
  const barEl=document.getElementById('bar');
  const mapsBtn=document.getElementById('mapsBtn');

  function formatTimeMinutes(mins){
    if(mins<1) return "≤1 min";
    const h=Math.floor(mins/60), m=Math.round(mins%60);
    if(h>0) return h+"h "+m+"m";
    return m+" min";
  }

  startBtn.onclick = async ()=>{
    const destName = document.getElementById('destInput').value.trim();
    if(!destName){ alert("Please enter destination"); return; }
    const sampleSec = Math.max(5, parseInt(document.getElementById('sampleSec').value)||15);

    statusEl.innerText = "Getting GPS permission...";
    const dest = rhine.find(p=>p.town.toLowerCase() === destName.toLowerCase()) ||
                 rhine.find(p=>p.town.toLowerCase().includes(destName.toLowerCase())) ||
                 rhine.find(p=>p.town.toLowerCase().startsWith(destName.toLowerCase()));
    if(!dest){ alert("Destination not found in dataset. Use exact town name from dataset."); return; }

    destNameEl.innerText = "Destination: "+dest.town;

    statusEl.innerText = "Taking first GPS sample...";
    const pos1 = await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(p=>res(p.coords),err=>rej(err), {enableHighAccuracy:true, timeout:15000}));
    statusEl.innerText = `Waiting ${sampleSec}s to sample movement... Keep device steady on deck.`;
    await new Promise(r=>setTimeout(r, sampleSec*1000));
    statusEl.innerText = "Taking second GPS sample...";
    const pos2 = await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(p=>res(p.coords),err=>rej(err), {enableHighAccuracy:true, timeout:15000}));

    const moved = haversineKm(pos1.latitude,pos1.longitude,pos2.latitude,pos2.longitude);
    const timeHours = sampleSec / 3600;
    let speedKph = moved / timeHours;
    if (!isFinite(speedKph) || speedKph < 0.5) speedKph = 10;

    const near = nearestPoint(pos2.latitude,pos2.longitude);
    const currentKm = near.km;

    const distKm = riverDistanceKm(currentKm, dest.km);
    const direction = (dest.km > currentKm) ? "Downstream" : "Upstream";
    const travelHours = distKm / speedKph;
    const travelMins = travelHours * 60;
    const eta = new Date(Date.now() + travelMins*60000);

    const locksLeft = countLocksBetween(currentKm, dest.km);

    const riverStartKm = rhine[0].km;
    const riverEndKm = rhine[rhine.length-1].km;
    let progressFraction;
    if(direction === "Downstream"){
      progressFraction = (currentKm - riverStartKm) / (riverEndKm - riverStartKm);
    } else {
      progressFraction = (riverEndKm - currentKm) / (riverEndKm - riverStartKm);
    }
    progressFraction = Math.max(0, Math.min(1, progressFraction));

    directionEl.innerText = direction;
    distEl.innerText = distKm.toFixed(1) + " km";
    etaEl.innerText = eta.toLocaleTimeString();
    timeleftEl.innerText = formatTimeMinutes(travelMins);
    speedEl.innerText = speedKph.toFixed(1) + " km/h";
    locksEl.innerText = locksLeft;
    fillEl.style.height = (progressFraction*100) + "%";

    Array.from(barEl.querySelectorAll('.lock-marker')).forEach(n=>n.remove());
    if(locksLeft>0){
      let start = currentKm, end = dest.km;
      let forward = (dest.km > currentKm);
      let locksPositions = [];
      if(forward){
        for(let i=0;i<rhine.length;i++){
          const p = rhine[i];
          if(p.km >= start && p.km <= end && (p.locks_to_next||0)>0){
            const nextKm = (i+1<rhine.length)? rhine[i+1].km : end;
            const lockCount = p.locks_to_next || 0;
            for(let k=1;k<=lockCount;k++){
              const lockKm = p.km + (k/(lockCount+1))*(nextKm - p.km);
              locksPositions.push(lockKm);
            }
          }
        }
      } else {
        for(let i=rhine.length-1;i>=0;i--){
          const p = rhine[i];
          if(p.km <= start && p.km >= end && (p.locks_to_next||0)>0){
            const prevKm = (i-1>=0)? rhine[i-1].km : end;
            const lockCount = p.locks_to_next || 0;
            for(let k=1;k<=lockCount;k++){
              const lockKm = p.km - (k/(lockCount+1))*(p.km - prevKm);
              locksPositions.push(lockKm);
            }
          }
        }
      }
      locksPositions.forEach(lp=>{
        const fractionAlongRiver = (lp - riverStartKm) / (riverEndKm - riverStartKm);
        const topPx = (1 - fractionAlongRiver) * 360;
        const el = document.createElement('div');
        el.className = 'lock-marker';
        el.style.top = Math.max(6, Math.min(352, topPx)) + 'px';
        barEl.appendChild(el);
      });
    }

    mapsBtn.href = `http://maps.apple.com/?saddr=${pos2.latitude},${pos2.longitude}&daddr=${dest.lat},${dest.lon}`;
    mapsBtn.innerText = "Open route in Apple Maps";

    const alarmMs = (travelMins - 30) * 60000;
    if(alarmMs > 0){
      statusEl.innerText = "Alarm will fire 30 min before arrival (while this page is open).";
      setTimeout(()=> {
        if (confirm("You will arrive in ~30 minutes. Open route?")) {
          window.open(mapsBtn.href, "_blank");
        } else {
          alert("Approaching destination in ~30 min.");
        }
      }, alarmMs);
    } else {
      statusEl.innerText = "Less than 30 minutes to destination — alarm not scheduled.";
    }

    output.style.display = 'block';
    statusEl.innerText += " Done.";
  };

})();
</script>
</body>
</html>
