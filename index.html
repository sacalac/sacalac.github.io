<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>River Real-Time Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([50.1109, 8.6821], 12); // default center (Frankfurt)
  
  // Base map tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  // OpenSeaMap river overlay
  L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
    attribution: 'OpenSeaMap',
    maxZoom: 18
  }).addTo(map);

  // Marker for your location
  const marker = L.marker([50.1109, 8.6821]).addTo(map);
  const trail = L.polyline([], {color: 'blue', weight: 3}).addTo(map);

  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const accuracy = pos.coords.accuracy;

      marker.setLatLng([lat, lon]);
      trail.addLatLng([lat, lon]);
      map.setView([lat, lon], 15);

    }, err => {
      console.error(err);
      alert('Error getting location: ' + err.message);
    }, { enableHighAccuracy: true });
  } else {
    alert('Geolocation is not supported by your browser.');
  }
</script>
</body>
</html>
